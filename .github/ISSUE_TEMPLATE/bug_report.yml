name: Bug report
description: Report incorrect synthesis, export, CLI, or viewer behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private provider URLs, or personal data.
  - type: input
    id: version
    attributes:
      label: Version and runtime
      description: Package version, Node.js version, operating system, and browser if relevant.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Core synthesis, Provider adapter, Reconciliation, CRS or geometry, Export, CLI, Viewer, Documentation]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include bounds, provider type/status, CRS, geometry type, expected behavior, actual behavior, and a minimal redistributable input.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized output or error
