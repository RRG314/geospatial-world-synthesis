name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:types
      - run: npm test
      - run: npm run test:consumer
      - run: npm run example
      - run: npm run example:reconciliation
      - run: npm run example:provider
      - run: npm run example:temporal
      - run: npm run example:export
      - run: npm run example:config
      - run: npm run example:incremental
      - run: npm run evaluate:reconciliation
      - run: npm run validate:package
      - run: npm run validate:docs

  browser:
    name: Browser demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4

  postgis:
    name: PostGIS integration
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: gws
          POSTGRES_PASSWORD: gws
          POSTGRES_DB: gws_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gws -d gws_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run example:postgis
        env:
          DATABASE_URL: postgresql://gws:gws@127.0.0.1:5432/gws_test
