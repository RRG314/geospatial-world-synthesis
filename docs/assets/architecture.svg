<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">Geospatial World Synthesis architecture</title>
  <desc id="description">Bounded real and local providers pass through normalization, indexed reconciliation, and evidence-preserving synthesis into a portable snapshot used by inspection, persistence, and neutral exports.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10253a"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153951"/>
      <stop offset="1" stop-color="#102d42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#61d9c4"/>
    </marker>
    <style>
      .eyebrow{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;fill:#61d9c4}
      .title{font:700 34px Inter,system-ui,sans-serif;fill:#f7fbff}
      .subtitle{font:400 16px Inter,system-ui,sans-serif;fill:#a9bfd1}
      .boxTitle{font:700 19px Inter,system-ui,sans-serif;fill:#f7fbff}
      .body{font:400 14px Inter,system-ui,sans-serif;fill:#b8cbd9}
      .small{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8fa8ba}
      .pill{font:600 12px Inter,system-ui,sans-serif;fill:#06131c}
      .flow{stroke:#61d9c4;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#background)"/>
  <circle cx="1240" cy="90" r="210" fill="#1e4660" opacity=".25"/>
  <circle cx="110" cy="710" r="240" fill="#0f716d" opacity=".13"/>
  <text x="70" y="70" class="eyebrow">PORTABLE · BOUNDED · INSPECTABLE</text>
  <text x="70" y="114" class="title">Evidence-preserving geospatial synthesis</text>
  <text x="70" y="145" class="subtitle">Source observations remain traceable through identity decisions, canonical entities, storage, and export.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="220" width="260" height="380" rx="22" fill="#0d2132" stroke="#31516a"/>
    <text x="98" y="260" class="eyebrow">01 · ACQUIRE</text>
    <text x="98" y="297" class="boxTitle">Bounded providers</text>
    <text x="98" y="330" class="body">Local files · GeoJSON</text>
    <text x="98" y="354" class="body">OGC API Features · ArcGIS</text>
    <text x="98" y="378" class="body">OSM Overpass · OSM map API</text>
    <rect x="98" y="415" width="182" height="31" rx="15" fill="#61d9c4"/>
    <text x="114" y="436" class="pill">bbox + timeout + budgets</text>
    <text x="98" y="484" class="small">coverage · status · attribution</text>
    <text x="98" y="507" class="small">request metrics · warnings</text>
    <text x="98" y="552" class="body">Failure is degradation,</text>
    <text x="98" y="575" class="body">never invented empty geography.</text>
  </g>

  <path class="flow" d="M 330 410 H 382"/>

  <g filter="url(#shadow)">
    <rect x="385" y="190" width="670" height="440" rx="24" fill="url(#core)" stroke="#3e6d86"/>
    <text x="420" y="233" class="eyebrow">02–04 · PORTABLE CORE</text>
    <rect x="420" y="265" width="180" height="270" rx="18" fill="#0b2435" stroke="#315f76"/>
    <text x="444" y="302" class="boxTitle">Normalize</text>
    <text x="444" y="337" class="body">Validate records</text>
    <text x="444" y="361" class="body">Transform CRS</text>
    <text x="444" y="385" class="body">Check geometry</text>
    <text x="444" y="409" class="body">Create provenance</text>
    <text x="444" y="460" class="small">source identity retained</text>
    <text x="444" y="483" class="small">credentials redacted</text>

    <path class="flow" d="M 600 400 H 627"/>

    <rect x="630" y="265" width="180" height="270" rx="18" fill="#0b2435" stroke="#315f76"/>
    <text x="654" y="302" class="boxTitle">Reconcile</text>
    <text x="654" y="337" class="body">Stable identifiers</text>
    <text x="654" y="361" class="body">RBush candidates</text>
    <text x="654" y="385" class="body">Entity policies</text>
    <text x="654" y="409" class="body">Explicit reasons</text>
    <text x="654" y="460" class="small">MATCH · AMBIGUOUS</text>
    <text x="654" y="483" class="small">NO_MATCH · relationships</text>

    <path class="flow" d="M 810 400 H 837"/>

    <rect x="840" y="265" width="180" height="270" rx="18" fill="#0b2435" stroke="#315f76"/>
    <text x="864" y="302" class="boxTitle">Synthesize</text>
    <text x="864" y="337" class="body">Canonical entities</text>
    <text x="864" y="361" class="body">Property claims</text>
    <text x="864" y="385" class="body">Conflicts · time</text>
    <text x="864" y="409" class="body">Stable fingerprint</text>
    <text x="864" y="460" class="small">resolution explains</text>
    <text x="864" y="483" class="small">without deleting evidence</text>

    <rect x="530" y="566" width="380" height="38" rx="19" fill="#f1c75b"/>
    <text x="566" y="591" class="pill">FROZEN, RENDERER-NEUTRAL SNAPSHOT</text>
  </g>

  <path class="flow" d="M 1055 410 H 1107"/>

  <g filter="url(#shadow)">
    <rect x="1110" y="220" width="260" height="380" rx="22" fill="#0d2132" stroke="#31516a"/>
    <text x="1138" y="260" class="eyebrow">05 · USE</text>
    <text x="1138" y="297" class="boxTitle">Neutral consumers</text>
    <text x="1138" y="335" class="body">CLI + public JavaScript API</text>
    <text x="1138" y="368" class="body">Evidence viewer</text>
    <text x="1138" y="401" class="body">JSON / GeoJSON</text>
    <text x="1138" y="425" class="body">FlatGeobuf / PROV-JSON</text>
    <text x="1138" y="458" class="body">JSON store / PostGIS*</text>
    <rect x="1138" y="500" width="148" height="31" rx="15" fill="#61d9c4"/>
    <text x="1158" y="521" class="pill">inspect + diff + export</text>
    <text x="1138" y="570" class="small">* experimental in 0.2.0</text>
  </g>

  <text x="70" y="695" class="subtitle">Invariants: preserve source identity · do not force ambiguity · retain competing claims · expose provider failure · never silently repair uncertain geometry</text>
</svg>
